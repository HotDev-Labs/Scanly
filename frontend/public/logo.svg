<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <!-- Logo Mark -->
  <g transform="translate(0, 0)">
    <!-- Solid Blue Squircle Backdrop -->
    <rect width="64" height="64" rx="16" fill="#1E40AF"/>

    <!-- Luggage Handle -->
    <path d="M24 14V11C24 9.34315 25.3431 8 27 8H37C38.6569 8 40 9.34315 40 11V14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Luggage Body -->
    <rect x="13" y="14" width="38" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Viewfinder Corners -->
    <path d="M21 27V23C21 21.8954 21.8954 21 23 21H27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 27V23C43 21.8954 42.1046 21 41 21H37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M21 39V43C21 44.1046 21.8954 45 23 45H27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 39V43C43 44.1046 42.1046 45 41 45H37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Checkmark -->
    <path d="M25 33L29.5 37.5L39 28" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wheels -->
    <circle cx="21" cy="54" r="2.5" fill="#FFFFFF"/>
    <circle cx="43" cy="54" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="82" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#1E40AF" letter-spacing="-0.5">Scanly</text>
  <text x="82" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#1E3A8A" letter-spacing="1.2">SMART TRANSIT VERIFICATION</text>
</svg>
