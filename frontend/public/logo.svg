<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <defs>
    <linearGradient id="scanly-grad-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="scanly-laser-full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(0, 0)">
    <!-- Squircle Backdrop -->
    <rect width="64" height="64" rx="16" fill="url(#scanly-grad-full)"/>

    <!-- Luggage Handle -->
    <path d="M24 14V11C24 9.34315 25.3431 8 27 8H37C38.6569 8 40 9.34315 40 11V14" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>

    <!-- Luggage Body -->
    <rect x="13" y="14" width="38" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Viewfinder Corners -->
    <path d="M21 27V23C21 21.8954 21.8954 21 23 21H27" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 27V23C43 21.8954 42.1046 21 41 21H37" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M21 39V43C21 44.1046 21.8954 45 23 45H27" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 39V43C43 44.1046 42.1046 45 41 45H37" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Checkmark -->
    <path d="M25 33L29.5 37.5L39 28" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Laser Beam -->
    <line x1="16" y1="33" x2="48" y2="33" stroke="url(#scanly-laser-full)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="21" cy="54" r="2" fill="#93C5FD"/>
    <circle cx="43" cy="54" r="2" fill="#93C5FD"/>
  </g>

  <!-- Wordmark -->
  <text x="82" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">Scanly</text>
  <text x="82" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#93C5FD" letter-spacing="1.2">SMART TRANSIT VERIFICATION</text>
</svg>

